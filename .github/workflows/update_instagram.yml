name: Update Instagram Data

on:
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Update Instagram Data
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node scripts/update-instagram-data.js

      - name: Commit and Push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          # Signed Instagram media URLs expire. The job stores MP4s and posters
          # under public/media/tinkerverse/reels and commits only that durable set.
          # The curated journal stays as the TinkerVerse story.
          git checkout -- data/tinkerverse_journal.json || true
          git add -- data/tinkerverse_reels.json public/media/tinkerverse/reels
          git diff --cached --quiet || (git commit -m "chore: update tinkerverse reels" && git push)
