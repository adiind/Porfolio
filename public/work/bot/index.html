<style>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Units: 1 = 1 inch. Bench top is y = 0. Wall is behind (-z). +z points at the person.
const Q = new URLSearchParams(location.search);
const STILL = Q.has('still'), CLOSE = Q.has('close');

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color('#080b1a');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .45;

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 2, 800);

// ---------------- drawn surfaces ----------------
const ANISO = renderer.capabilities.getMaxAnisotropy();
function tex(w, h, draw, { srgb = true, repeat = [1, 1], clamp = false } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = clamp ? THREE.ClampToEdgeWrapping : THREE.RepeatWrapping;
  t.repeat.set(...repeat); t.anisotropy = ANISO;
  return t;
}
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909), (s >>>= 0) / 4294967296)); }
function grain(g, w, h, n, a, seed, size = 1.2) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) { g.fillStyle = r() > .5 ? `rgba(255,255,255,${a * r()})` : `rgba(0,0,0,${a * r()})`; g.fillRect(r() * w, r() * h, size, size); }
}

// Butcher-block bench top: strips of oak, each with its own tone and grain
function butcher(g, w, h, mono) {
  const r = rng(21);
  const strips = 26, sw = h / strips;
  for (let i = 0; i < strips; i++) {
    const tone = mono ? 120 + r() * 40 : 0;
    const base = mono ? `rgb(${tone},${tone},${tone})` : `hsl(${28 + r() * 8}, ${38 + r() * 14}%, ${50 + r() * 12}%)`;

{ const base = new THREE.Mesh(new RoundedBoxGeometry(STD.W + 2, 2.2, 5.2, 3, .5), plyM); base.position.y = 1.1; base.castShadow = base.receiveShadow = true; standee.add(base);
  const card = new THREE.Group(); card.position.set(0, 1.4, -.4); card.rotation.x = -.24; standee.add(card);
  const board = new THREE.Mesh(new RoundedBoxGeometry(STD.W, STD.H, .3, 3, .12), new THREE.MeshStandardMaterial({ color: '#efeadf', roughness: .9 }));
  board.position.y = STD.H / 2; board.castShadow = true; card.add(board);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(STD.W - .02, STD.H - .02), new THREE.MeshStandardMaterial({ map: stdTex, emissive: '#ffffff', emissiveMap: stdTex, emissiveIntensity: .42, roughness: .88, transparent: true }));
  face.position.set(0, STD.H / 2, .16); card.add(face); standee.userData.face = face; }
function placeStandee(phone) {
  if (phone) { standee.position.set(-4, 0, 40); standee.rotation.y = 0; standee.scale.setScalar(1.15); }
  else { standee.position.set(-38, 0, -3); standee.rotation.y = .3; standee.scale.setScalar(1); }
}
function stdButtonAt(cx, cy) {
  ptr.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObject(standee.userData.face)[0]; if (!hit?.uv) return null;
  const x = hit.uv.x * stdC.width, y = (1 - hit.uv.y) * stdC.height;
  return stdBtns.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) || null;
}
// Safari counts only sound started inside the click, so the first line starts here and the rest are primed silently
function playDemo() {
  if (!HIST.length) { logBox.replaceChildren(); youNoted = false; }
  run(DEMO()); played = true; drawStandee();
  const first = VOICES[S.voice[0]]; S.spoken = new Set([0]);
  if (SOUND) { first.currentTime = 0; first.play().catch(() => {}); }
  for (const id of S.voice.slice(1)) { const a = VOICES[id]; a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; }); }
}
function standeeButton(id) {
  if (id === 'play') return playDemo();
  SOUND = !SOUND; drawStandee();
  if (!SOUND) return stopVoices();
  // turned back on mid-demo: the line being said now starts from its beginning
  if (S.voice) { const rt = clock() - S.start; S.L.forEach((L, i) => { if (rt >= L.at && rt < L.at + 2.5) { const a = VOICES[S.voice[i]]; a.currentTime = 0; a.play().catch(() => {}); } }); }
}

let hover = null, drag = null;
const cv = renderer.domElement; cv.style.touchAction = 'none';
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false, yaw: view.yawT, pitch: view.pitchT }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 5) drag.moved = true;
    if (drag.moved) { view.yawT = THREE.MathUtils.clamp(drag.yaw - dx * .004, -.6, .6); view.pitchT = THREE.MathUtils.clamp(drag.pitch + dy * .003, -.12, .12); cv.style.cursor = 'grabbing'; return; } }
  cv.style.cursor = stdButtonAt(e.clientX, e.clientY) ? 'pointer' : 'grab';
});
cv.addEventListener('pointerup', e => { const tap = drag && !drag.moved; drag = null; cv.style.cursor = 'grab'; if (tap) { const b = stdButtonAt(e.clientX, e.clientY); if (b) standeeButton(b.id); } }); // the real Bot is spoken to, not tapped: bins don't answer clicks
cv.addEventListener('pointerleave', () => { hover = null; });
function popBins(dt) { const k = 1 - Math.exp(-dt * 12); for (const b of bins) { const tz = b === hover ? .9 : b === aimed ? .35 * ledLevel : 0; b.z += (tz - b.z) * k; b.bin.position.z = .2 + b.z; } }

// ================= ask box and quick asks =================
const form = document.getElementById('dock'), input = document.getElementById('q');
// ================= the real AI: Claude Haiku via ./server.mjs; built-in answers if it's not there =================
const HIST = []; let AI = false; // (no /api/bot on the public site)
async function askAI(text) {
  text = text.slice(0, 300);
  const S0 = script([['me', text, .05]], null, { you: true });
  S0.think.push([S0.listen[0][1], 1e9]); run(S0);
  HIST.push({ role: 'user', content: text });
  let r = null;
  if (AI) try {
    const res = await fetch('/api/bot', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ history: HIST.slice(-12) }) });
    if (res.ok) r = await res.json(); else if (res.status !== 502) AI = false;
  } catch { AI = false; }
  if (!r) { const l = answer(text); r = { say: l.say, bin: l.bin?.name ?? null, chips: l.chips }; }
  HIST.push({ role: 'assistant', content: r.say });
  if (S !== S0) { addMsg('bot').textContent = r.say; return; } // they already asked something else: still keep it in the chat
  const b = r.bin ? BIN(r.bin) : null; if (b) lastPart = b;
  const at = Math.max(clock() - S0.start, S0.listen[0][1] + .25), L = { who: 'bot', text: r.say, at, locate: !!b };
  S0.think[0][1] = at; S0.L.push(L); S0.bin = b; S0.locateAt = b ? at + .15 : null; S0.chips = r.chips?.length ? r.chips : null; S0.end = at + dur(L); lastDraw = -1;
}
document.getElementById('mplay').addEventListener('click', () => playDemo());
document.getElementById('msnd').addEventListener('click', () => standeeButton('sound'));
addEventListener('keydown', e => { if (e.key === 'Escape') location.assign('/'); });
document.getElementById('live').addEventListener('click', () => { document.getElementById('chat').classList.add('open'); input.focus(); });
form.addEventListener('submit', e => { e.preventDefault(); const v = input.value.trim(); if (!v) return; input.value = ''; askAI(v); });
const chipBox = form.querySelector('.chips'); let chipsShown = null;
const START_CHIPS = ['Something that turns a little', 'Spin a wheel', 'Make it beep', 'Measure distance'];
function setChips(list) { if (chipsShown === list) return; chipsShown = list; chipBox.replaceChildren(...list.map((q, i) => { const c = document.createElement('button'); c.type = 'button'; c.textContent = q; c.style.animationDelay = i * 60 + 'ms'; c.onclick = () => askAI(q); return c; })); }
setChips(START_CHIPS);
const EX = ['Tell the Bot what you’re building…', 'Try “something that glows”', 'Try “I’m making a plant alarm”', 'Try “hi”'];
let exI = 0; setInterval(() => { if (document.activeElement !== input && !input.value) input.placeholder = EX[++exI % EX.length]; }, 3200);

// ================= words on screen: the Bot from the TV, the student as subtitles =================
const $ = id => document.getElementById(id);
const tag = $('tag'), lead = $('lead');
const [leadP, leadC, tagP, tagC] = [lead.querySelector('path'), lead.querySelector('circle'), lead.querySelector('path.t2'), lead.querySelector('circle.t2')];
const _p = new THREE.Vector3();
function toScreen(obj, local) { _p.copy(local); obj.localToWorld(_p); _p.project(camera); return [(_p.x * .5 + .5) * innerWidth, (-_p.y * .5 + .5) * innerHeight]; }
const logBox = $('log');
let dotsEl = null, youNoted = false;
function addMsg(cls, note) {
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; logBox.append(n); }
  const m = document.createElement('div'); m.className = 'm ' + cls; logBox.append(m); return m;
}
const toBottom = () => { logBox.scrollTop = logBox.scrollHeight; };
let subKey = '', callKey = '';
function drawLog(rt) {
  S.logged ??= new Set(); let moved = false;
  S.L.forEach((L, i) => {
    if (rt >= L.at && !S.logged.has(i)) { S.logged.add(i);
      if (dotsEl) { dotsEl.remove(); dotsEl = null; }
      let note = null;
      if (i === 0 && !S.you) note = 'Sample chat · a student and the Bot';
      if (S.you && L.who === 'me' && !youNoted) { youNoted = true; note = 'Your turn'; }
      L.el = addMsg(L.who === 'bot' ? 'bot' : S.you ? 'me' : 'me student', note); moved = true; }
    if (L.el && !L.done) { const t = typed(L, rt); if (L.el.textContent !== t) { L.el.textContent = t; moved = true; }
      if (t.length === L.text.length) { L.done = true;
        if (L.who === 'bot' && L.locate && S.bin) { const n = document.createElement('div'); n.className = 'lit'; n.textContent = `● Bin ${binNo(S.bin)} lit · ${S.bin.name}`; L.el.after(n); } } }
  });
  const T = S.think.find(([a, b]) => rt >= a && rt < b), B = S.L.some(L => L.who === 'bot' && rt >= L.at && L.at >= (T?.[0] ?? 0));
  if (T && !B && !dotsEl) { dotsEl = addMsg('bot dots'); dotsEl.innerHTML = '<i></i><i></i><i></i>'; moved = true; }
  if (!T && dotsEl) { dotsEl.remove(); dotsEl = null; }
  if (moved) toBottom();
}
function drawWords(rt) {
  drawLog(rt);
  const lastBot = S.L.filter(l => l.who === 'bot').pop();
  if (S.chips && lastBot && rt >= lastBot.at + dur(lastBot)) setChips(S.chips);
  const lk = aimed ? ss(.3, 1, ledLevel) : 0;
  tag.style.opacity = lk; tagP.style.opacity = tagC.style.opacity = lk;
  if (lk > 0) { tag.lastChild.textContent = `Bin ${binNo(aimed)} · ${aimed.name}`;
    const [bx, by] = toScreen(panel, new THREE.Vector3(aimed.x, aimed.h + 2.6, 4 + aimed.z)); let tx = bx - tag.offsetWidth / 2, ty = by - (innerWidth > 700 ? 96 : 84); if (tx < 12) { tx = 12; }
    tag.style.left = tx + 'px'; tag.style.top = ty + 'px';
    tagP.setAttribute('d', ty > by ? `M${bx},${ty - 6} L${bx},${by}` : `M${bx},${ty + tag.offsetHeight + 6} L${bx},${by}`); tagC.setAttribute('cx', bx); tagC.setAttribute('cy', by); }
}

const VOICES = Object.fromEntries(['me1', 'bot1', 'me2', 'bot2'].map(id => [id, Object.assign(new Audio(`voice/${id}.m4a`), { preload: 'auto' })]));
function speak(rt) {
  if (!S.voice || !SOUND) return; S.spoken ??= new Set();
  S.L.forEach((L, i) => { if (rt >= L.at && rt < L.at + .5 && !S.spoken.has(i)) { S.spoken.add(i); const a = VOICES[S.voice[i]]; a.currentTime = 0; a.playbackRate = 1; a.preservesPitch = true; a.play().catch(() => {}); } });
}
window.__voices = VOICES;
const stopVoices = () => Object.values(VOICES).forEach(a => a.pause());
function frame() {
  const now = clock(), dt = Math.min(.05, Math.max(0, now - lastNow)); lastNow = now;
  const rt = now - S.start;
  matU.uTime.value = now;
  placeCamera(FIX != null ? 1 : dt);
  drawTV(rt, now);
  updateLed(rt, dt, now);
  popBins(FIX != null ? 1 : dt);
  drawWords(rt);
  speak(rt);
}

// soft chime when the bin lights (after any click; browsers block sound before that)
let actx = null;
addEventListener('pointerdown', () => { actx ??= new AudioContext(); });
function chime() {
  if (!actx || !SOUND) return;
  const now = actx.currentTime;
  [[880, 0], [1318.5, .09]].forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.12, now + d + .01); g.gain.exponentialRampToValueAtTime(.0001, now + d + 1.2);
    o.connect(g).connect(actx.destination); o.start(now + d); o.stop(now + d + 1.3); });
}
function fit() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); gtao.setSize(w, h);
  camera.aspect = w / h;
  if (camera.aspect < 1) { camera.fov = 36; base.set(-4, 150, 200); look.set(-4, 8, 4); } // phone: rack above, standee in front of it
  else { camera.fov = 30; base.set(-17, 80, 94); look.set(-17, 12, -12); } // shifted left so the standee and the rack share the frame
  const P = w > 700 ? Math.min(380, w * .34) + 16 : 0; // chat panel width
  camera.setViewOffset(w, h, P / 2, w > 700 ? h * .02 : h * .2, w, h);
  placeStandee(w <= 700);
  placeCamera(1);
  camera.updateProjectionMatrix();
}
addEventListener('resize', fit); fit();
Promise.all([...Object.values(PHOTOS).map(im => im.decode().catch(() => {})), document.fonts.load('500 30px Geist').catch(() => {})]).then(() => {
  renderer.setAnimationLoop(() => { frame(); composer.render(); });
  window.__ready = true; window.__rack = () => bins.map(b => ({ bin: binNo(b), name: b.name, what: b.sub, where: where(b) }));
  window.__stdAt = id => { const b = stdBtns.find(b => b.id === id); return toScreen(standee.userData.face, new THREE.Vector3(((b.x + b.w / 2) / stdC.width - .5) * STD.W, (.5 - (b.y + b.h / 2) / stdC.height) * STD.H, 0)); };
  window.__binAt = name => { const b = bins.find(b => b.name === name); return toScreen(b.bin, new THREE.Vector3(0, .7, BIN_D)); };
});
