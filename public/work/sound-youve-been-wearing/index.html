<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sound You've Been Wearing · Adi Agarwal</title>
<meta name="description" content="The Sound You've Been Wearing: an interactive 3D board. Drag keys into records, turn a record for volume, and layer real music.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1b62d4">
<style>
  /* the home mat's blue, so the screen is never black or white before the scene has drawn */
  html, body { margin: 0; height: 100%; background: #1b62d4; overflow: hidden; }
  canvas { display: block; }
  /* the scene's HUD (orbit hint, "Download GLB") is not part of the portfolio version; the scene still looks it up, so it stays in the page, hidden */
  #hud { display: none !important; }
  /* Close: DESIGN.md's exit control. Top right, a solid chip in the page's canvas colour with its ink as text and a 1px ink border. */
  #close { position: fixed; top: 24px; right: 24px; z-index: 50; box-sizing: border-box; min-width: 44px; min-height: 44px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    font: 600 15px/1 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .01em;
    color: #ffffff; background: #1b62d4; border: 1px solid #ffffff; border-radius: 999px; }
  #close:hover, #close:focus-visible { color: #1b62d4; background: #ffffff; outline: none; }
  #close:focus-visible { box-shadow: 0 0 0 3px #1b62d4, 0 0 0 5px #ffffff; }
  #close .x { font-size: 17px; line-height: 1; }
  @media (max-width: 479px) { #close { top: 16px; right: 16px; width: 44px; padding: 0; } #close .label { display: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<script>
  /* Preloaded by the home page in an iframe (?embed=1; FlipBookApp's board embed): the scene loads and draws one frame, then waits
     (window.__embedIdle: it draws about once a second) until the home page wakes it, hands it the record's spin clock and starts it. */
  (function () {
    if (new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window) {
      window.__embedMode = true; window.__embedIdle = true; window.__embed = { ready: false };
    }
  })();
</script>
<script>
  /* Arriving from the home mat's record (lib/mat/soundRecord.ts): the home page's camera has just flown down onto the record and kept
     its last frame in sessionStorage. That frame is painted full screen first thing, on the mat's blue, so the browser never shows
     black or white; play.js cross-fades it away (window.__diveFade) once this scene has drawn its own first frame, and starts the
     intro by itself with the record already turning. A direct visit has no such note and opens as it always did. */
  (function () {
    var d = null, img = null;
    try {
      d = JSON.parse(sessionStorage.getItem('record-dive') || 'null'); img = sessionStorage.getItem('record-dive-frame');
      sessionStorage.removeItem('record-dive'); sessionStorage.removeItem('record-dive-frame');
    } catch (e) { d = null; }
    if (!d || d.from !== 'home' || typeof d.at !== 'number' || Date.now() - d.at > 10000 || d.href !== location.pathname) return;
    if (!(typeof img === 'string' && /^data:image\/jpeg;base64,/.test(img))) img = null;
    d.frame = !!img && !!d.frame;
    window.__dive = d;
    var c = document.createElement('div');
    c.id = 'dive-cover';
    c.setAttribute('aria-hidden', 'true');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483000;pointer-events:none;background:#1b62d4' + (img ? ' url("' + img + '") center/cover no-repeat' : '') + ';opacity:1;transition:opacity .15s linear';
    document.documentElement.appendChild(c);
    var gone = false;
    function fade() {
      if (gone) return;
      gone = true;
      c.style.opacity = '0';
      setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 300);
    }
    window.__diveFade = fade;
    setTimeout(fade, 9000);   /* never stay covered if the scene fails to start */
  })();
</script>
</head>
<body>
<div id="hud"><span>The Sound You've Been Wearing</span><button id="dl">Download GLB</button></div>
<button type="button" id="close" aria-label="Close and return to the portfolio"><span class="x" aria-hidden="true">✕</span><span class="label">Close</span></button>
<script>
  (function () {
    function close() { if (window.__embedMode) window.parent.history.back(); else window.location.assign('/'); }
    document.getElementById('close').addEventListener('click', close);
    addEventListener('keydown', function (e) { if (e.key === 'Escape' && !e.defaultPrevented) { e.preventDefault(); if (window.__tourEsc && window.__tourEsc()) return; close(); } });   /* behind the scenes, Esc first goes back to the front */
  })();
</script>
<script type="module" src="./scene.js"></script>
</body>
</html>
