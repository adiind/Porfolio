  <!-- (ship layer, scripts/ship/main.patch) Which home this window gets, decided once, before anything is fetched. "mat": "/" or "/mat"
       in a window the 3D home can take, at least 760 px wide and 1.15 times as wide as tall (the rule of lib/ship/frontDoor.ts and
       components/flipbook/FlipBookApp.tsx); "/#writings" is the old home's. "book": /book/<slug>. "old": the old home, everywhere
       else, except "/" and "/mat" in a window too small for the 3D home, which go to the flat home at /home-flat/. The head scripts below read window.__shipDoor. The old home's hero picture is preloaded for the old home only. -->
  <script>
    (function () {
      var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight, p = location.pathname;
      var door = /^\/(mat\/?)?$/i.test(p) && location.hash !== '#writings' && w >= 760 && h > 0 && w / h >= 1.15 ? 'mat'
        : /^\/book(?:\/[a-z0-9-]+)?\/?$/i.test(p) ? 'book' : /^\/studio\/?$/.test(p) ? 'studio' : 'old';
      // "/" or "/mat" in a phone-sized, narrow or tall window: the flat home (public/home-flat), before anything else loads
      if (door === 'old' && /^\/(mat\/?)?$/i.test(p) && location.hash !== '#writings') { location.replace('/home-flat/' + location.hash); return; }
      window.__shipDoor = door;
      if (door !== 'old') return;
      var hero = document.createElement('link');
      hero.rel = 'preload'; hero.as = 'image'; hero.href = '/images/adi_floating_avatar_workshop.png'; hero.fetchPriority = 'high';
      document.head.appendChild(hero);
    })();
  </script>

  <!-- The 3D home page (/mat) starts in a dark room with the greeting in it, then the app brings the light up over the mat
       (components/flipbook/FlipBookApp.tsx). Drawn here, ahead of every script, so there are words on screen from the

  <style>

       carries it onto the cut card letters on the mat, which are cut from this same typeface at this same spacing
       (lib/mat/wordPieces.ts GREETING: FB Bricolage 800, letter spacing -2 px at 84 px), so it lands on them exactly. */
    #mat-hello { position: fixed; left: 0; right: 0; top: 52vh; z-index: 29; text-align: center; pointer-events: none; }
    #mat-hello span { display: inline-block; padding-bottom: .14em; transform-origin: 0 0;
      font-family: 'FB Bricolage', sans-serif; font-weight: 800; font-size: clamp(44px, 7.2vw, 124px); line-height: 1;
      letter-spacing: -.0238em; color: #f4e6c8;
      opacity: 0; translate: 0 14px; filter: brightness(.62);
      transition: opacity .5s ease-out, translate .5s ease-out, filter .16s ease;
      text-shadow: 0 12px 16px rgba(0, 0, 0, .7); }
    #mat-hello span em { font-style: normal; font-weight: 800; letter-spacing: inherit; color: #f4e6c8; }
    #mat-hello.is-shown span { opacity: 1; translate: none; }
    #mat-hello.is-on span { filter: brightness(1); }
    @media (prefers-reduced-motion: reduce) { #mat-hello span { translate: none; transition: opacity .3s ease; } }

  <script>
    (function () {
      // (ship layer, scripts/ship/overlays.mjs) "/" and "/mat" in a window the 3D home can take, as the door script above decided
      if (window.__shipDoor !== 'mat') return;
      // a phone or a narrow or tall window gets the flat page (FlipBookApp sends it there): no dark room on the way
      if (innerWidth < 760 || innerWidth / innerHeight < 1.15) return;
      document.documentElement.style.background = '#02070f';
      // the greeting, in the cut letters' own typeface (the same file lib/flipbook/pageArt.ts loads for the mat's cards, so
      // it is fetched once); shown when the face has arrived, or after 3.5 s in whatever face there is (a slow line
      // keeps the room dark a little longer rather than showing a stand-in face that then jumps). Once per visit: coming
      // back to the mat from a project page, the room simply lights.
      var greeted = false;
      try { greeted = sessionStorage.getItem('mat-greeted') === '1'; } catch (e) {}
      if (greeted) return;
      var hello = document.createElement('div');
      hello.id = 'mat-hello';
      hello.setAttribute('aria-hidden', 'true');
      hello.innerHTML = '<span>Hi, I’m <em>Adi.</em></span>';
      document.documentElement.appendChild(hello);
      var shown = false, show = function () { if (shown) return; shown = true; requestAnimationFrame(function () { hello.classList.add('is-shown'); }); };
      setTimeout(show, 3500);
      if (window.FontFace && document.fonts) {
        var face = new FontFace('FB Bricolage', 'url(/fonts/flipbook/Bricolage-800.woff2)', { weight: '800', style: 'normal', display: 'block' });
        face.load().then(function (loaded) { document.fonts.add(loaded); show(); }, show);
      } else show();
    })();
  </script>

      book.style.cssText = 'position:absolute;box-sizing:border-box;left:' + (x - w / 2 - e) + 'px;top:' + (y - w * 0.3 - e) + 'px;width:' + (w + 2 * e) + 'px;height:' + (w * 0.6 + 2 * e) + 'px;padding:' + e + 'px;transform:rotate(' + t + 'deg);background:' + bc + ';border-radius:0 ' + (w * 0.053) + 'px ' + (w * 0.053) + 'px 0;box-shadow:-1.5px 2px 2px rgba(2,10,44,.42),-7px 9px 12px -2px rgba(2,10,44,.36),-24px 30px 36px -9px rgba(2,10,44,.5)';
      if (cv) { var c = new Image(); c.src = cv; c.alt = ''; c.style.cssText = 'display:block;width:100%;height:100%;object-fit:cover;border-radius:0 ' + (w * 0.036) + 'px ' + (w * 0.036) + 'px 0'; book.appendChild(c); }
      held.appendChild(book);

  <script>

        'pg-haircare': { bg: '#4f46e5', kind: 'pop', src: '/images/pg/pg-logo-official.svg', ratio: 1 }

      var ARCHES = 'm195.8 17.933c23.3 0 42.2 98.3 42.2 219.7h34c0-130.7-34.3-236.5-76.3-236.5-24 0-45.2 31.7-59.2 81.5-14-49.8-35.2-81.5-59-81.5-42 0-76.2 105.7-76.2 236.4h34c0-121.4 18.7-219.6 42-219.6s42.2 90.8 42.2 202.8h33.8c0-112 19-202.8 42.3-202.8';
      // the pen that draws the arches: up the left leg, over the first arch, down the middle, over the second, down

      function play(el, name, dur, delay, at, timing) {
        el.style.animation = name + ' ' + dur + 'ms ' + (timing || ease) + ' ' + (delay - (Date.now() - at)) + 'ms both';
      }

  <!-- Arriving at a case study from a clipboard on the home page's mat: the splash in the project's colour that covered
       the mat (lib/mat/caseStudyHandoff.ts) is drawn again first thing, so the screen never goes black or white between
       the two pages, then lifts away once the case study has drawn itself. -->
  <script>
    (function () {
      if (!/^\/work\//.test(location.pathname)) return;

      try { s = JSON.parse(sessionStorage.getItem('case-splash') || 'null'); sessionStorage.removeItem('case-splash'); } catch (e) { s = null; }
      if (!s || typeof s.at !== 'number' || Date.now() - s.at > 8000 || s.href !== location.pathname) return;
      if (!/^#[0-9a-f]{6}$/i.test(s.c) || typeof s.t !== 'string' || typeof s.p !== 'string') return;

      var font = "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif";
      var d = document.createElement('div');
      d.id = 'case-splash';
      d.setAttribute('aria-hidden', 'true');
      d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;pointer-events:none;background:' + s.c + ';transition:transform .5s cubic-bezier(.7,0,.25,1)';
      var box = document.createElement('div');
      box.style.cssText = 'text-align:center;color:#fff;padding:0 24px;font-family:' + font + ';transition:transform .5s cubic-bezier(.7,0,.25,1),opacity .26s ease';
      var name = document.createElement('div');
      name.textContent = s.t.slice(0, 80);
      name.style.cssText = 'font-weight:700;font-size:clamp(34px,5.4vw,78px);line-height:1.05;letter-spacing:-.02em';
      var by = document.createElement('div');

      by.style.cssText = 'margin-top:12px;font-weight:600;font-size:clamp(14px,1.4vw,19px);letter-spacing:.06em;text-transform:uppercase;opacity:.86';
      box.appendChild(name); box.appendChild(by);
      // a sponsored project: its sponsor's logo and "Sponsored design project", carrying on from the home page's clock
      var mark = typeof s.i === 'string' && window.__caseMark ? window.__caseMark(s.i, s.t, s.at) : null;
      if (mark) { box.textContent = ''; box.appendChild(mark); }
      d.appendChild(box);
      // (in the head, before anything that can hold the page up: the body does not exist yet)
      document.documentElement.appendChild(d);
      document.documentElement.style.background = s.c;

        if (gone) return;

        '/images/pg/pg-logo-official.svg',
        '/images/mat/story-art/self.webp',
        '/images/flipbook/jarvis/cover/still.webp',
        '/images/flipbook/muse/cover/still.webp',
        '/images/flipbook/bambu/cover.svg',
        '/images/flipbook/surya/cover/still.webp',
        '/images/flipbook/surya/parts/product.webp',
      ];
      // port-home:END first-frame
      // (also read by the 3D home, lib/mat/caseStudyHandoff.ts warmCaseStudies: the old home's code is what a case study needs)
      window.__shipCode = code;
      var first = door === 'mat' || door === 'old' ? code[door] : null;
      if (door !== 'mat') pictures = [];

      };
      // All of it asked for at once, straight away. It used to go one after the other: a bulb picture, then the code once the
      // bulb was in, then the pictures once the code was in, which cost about 0.35 s on an ordinary line before the 3D code
      // was even asked for. The browser and the server order them by priority instead.
      var js = first ? first.js : [], css = first ? first.css : [];

      if (door === 'mat') add('preload', '/fonts/flipbook/Geist-Variable.woff2', 'font', true, { type: 'font/woff2' });

      // stack, are low and must not share the line with them)
