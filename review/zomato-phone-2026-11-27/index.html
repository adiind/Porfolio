<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zomato on the phone: a picture of the answer (prototype, not live)</title>
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{background:#1b62d4;background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px;font-family:'FB Geist',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  main{max-width:430px;margin:0 auto;padding:76px 16px 64px}
  .back{position:fixed;left:14px;top:14px;z-index:5;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:#0a0b10;color:#fff;font:600 15px 'FB Geist',system-ui,sans-serif;text-decoration:none;box-shadow:0 10px 22px -10px rgba(2,10,44,.8)}
  h1{font:800 44px/1 'FB Bricolage','FB Geist',system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 4px}
  .role{font:500 16px/1.3 'FB Geist',system-ui,sans-serif;opacity:.92;margin:0 0 6px}
  .hero{display:block;width:78%;margin:6px auto 0;filter:drop-shadow(-14px 18px 16px rgba(2,10,44,.55))}
  .thing{margin:34px 0 0}
  .thing canvas,.thing img.print{display:block;width:100%;height:auto;border-radius:10px;box-shadow:-10px 14px 22px -8px rgba(2,10,44,.6)}
  .thing.narrow canvas{width:76%;margin:0 auto;border-radius:3px}
  .thing.tilt-l canvas{transform:rotate(-1.4deg)} .thing.tilt-r canvas{transform:rotate(1.2deg)}
  .box{display:grid;gap:0}
  .box canvas{border-radius:16px 16px 0 0}
  .box .shot{background:#f6f3ea;border-radius:0 0 16px 16px;padding:14px;box-shadow:-10px 14px 22px -8px rgba(2,10,44,.6)}
  .box.kraft .shot{background:#c79a63}
  .box .shot img{display:block;width:100%;border-radius:8px}
  .photo{width:84%;margin:0 auto;transform:rotate(2deg);background:#f7f6f2;padding:8px;border-radius:6px;box-shadow:-10px 14px 22px -8px rgba(2,10,44,.6)}
  .photo img{display:block;width:100%}
  a.hit{position:absolute;left:0;right:0}
  .rel{position:relative}
</style></head>
<body>
<a class="back" href="/home-flat/">← Back</a>
<main>
  <h1>Zomato</h1>
  <p class="role">Senior Product Analyst · Oct 2024 – Jul 2025</p>
  <img class="hero" src="./bag.jpg" alt="His Zomato rider's bag, open on the mat" style="border-radius:18px;width:100%;filter:none;box-shadow:-10px 14px 22px -8px rgba(2,10,44,.6)">
  <section class="thing narrow tilt-l" id="bill"></section>
  <section class="thing box" id="home"></section>
  <section class="thing box kraft" id="friends"></section>
  <section class="thing" id="rescue"></section>
  <section class="thing narrow tilt-r rel" id="press" style="--w:86%"></section>
  <section class="thing"><div class="photo"><img src="/images/mat/zomato/eternal.webp" alt="Adi at the Zomato office"></div></section>
</main>
<script type="module" src="./main.ts"></script>
</body></html>
