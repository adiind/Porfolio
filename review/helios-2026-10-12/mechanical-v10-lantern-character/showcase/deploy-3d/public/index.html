<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Scroll to watch the Helios lamp build itself, from a circuit board to a lamp that opens.">
<title>Helios V10 Assembly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the lamp stays fixed on a coloured stage; each scroll stop is one assembly step,
   named with a short label and title on the left (bottom on phones). Colour drifts as you scroll. */
:root {
  --night: #12101a;      /* fallback stage colour */
  --ink: #f3ece2;        /* text */
  --dim: #b4aabd;        /* secondary text */
  --accent: #7fd6e0;     /* drifts with the scroll, set from the script */
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html { background: var(--night); }
body { background: var(--night); color: var(--ink); font-family: var(--f-display); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#stage { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; }
#vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(120% 90% at 65% 45%, transparent 55%, rgba(6, 5, 10, 0.5) 100%); }

main { position: relative; z-index: 2; }
.step { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; }
.step.quiet { pointer-events: none; }
.copy { width: min(380px, 34vw); display: grid; gap: 10px; padding-block: 24px; }
.num { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase;
  display: flex; gap: 10px; align-items: center; transition: color 0.4s; }
.num::after { content: ""; flex: 0 0 36px; height: 1px; background: currentColor; opacity: 0.5; }
h2 { font-weight: 700; font-size: clamp(32px, 3.8vw, 50px); line-height: 1; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }

.hero .copy { width: min(540px, 46vw); }
.hero h1 { font-weight: 700; font-size: clamp(64px, 9vw, 132px); line-height: 0.86; letter-spacing: -0.045em; margin: 0; }
.hero h1 span { display: block; font-size: 0.3em; letter-spacing: -0.01em; color: var(--accent); margin-top: 16px; line-height: 1.1; font-weight: 500; transition: color 0.4s; }
.scrollhint { font-family: var(--f-mono); font-size: 12px; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.scrollhint i { display: inline-block; width: 1px; height: 28px; background: linear-gradient(var(--accent), transparent); animation: drip 1.8s ease-in-out infinite; }
@keyframes drip { 0%, 100% { transform: scaleY(0.4); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); }
.legend li { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.legend i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset; }
/* then and now: the first printed Helios, tilted toward the lamp it became */
.then { margin: 4px 0 6px; display: grid; gap: 10px; perspective: 900px; }
.then figure { margin: 0; transform: rotateY(16deg) rotateX(3deg); transform-origin: left center;
  transition: transform 0.6s cubic-bezier(.2,.7,.2,1); filter: drop-shadow(0 24px 30px rgba(0,0,0,0.55)); }
.then figure:hover { transform: rotateY(4deg) rotateX(0deg); }
.then img { display: block; width: 100%; max-width: 300px; height: auto; border-radius: 14px; }
.end .copy { width: min(480px, 40vw); }
.end h2 { font-size: clamp(28px, 2.8vw, 40px); }
.tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.tag b { color: var(--ink); font-weight: 500; }
.end .arrow { font-family: var(--f-mono); color: var(--accent); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.4s; }
.again { justify-self: start; margin-top: 6px; font: 500 14px var(--f-display); color: #12101a; background: var(--accent); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: background 0.4s; }
.again:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

#progress { position: fixed; z-index: 3; left: 0; right: 0; top: 0; height: 2px; }
#progress i { display: block; height: 100%; width: 0; background: var(--accent); }
#loading { position: fixed; z-index: 4; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  font-family: var(--f-mono); font-size: 12px; color: var(--dim); letter-spacing: 0.06em; background: rgba(30, 26, 40, 0.9); padding: 8px 14px; border-radius: 999px; }
#loading.err { color: #ff8a6b; }

@media (max-width: 760px) {
  .step { align-items: flex-end; }
  .copy, .hero .copy { width: 100%; padding-block: 24px 44px; }
  .hero .copy { padding-bottom: 56px; }
  .end .copy { width: auto; margin-inline: -16px; padding: 56px 16px 40px; background: linear-gradient(to top, rgba(10, 8, 14, 0.94) 62%, rgba(10, 8, 14, 0)); }
  .then img { max-width: 150px; }
  .then figure { transform: rotateY(12deg) rotateX(2deg); }
  h2 { font-size: 32px; }
}
@media (prefers-reduced-motion: reduce) { .scrollhint i { animation: none; } }
</style>

<script>
/* if the 3D scene never starts, say why on screen instead of failing silently */
window.__hErr = [];
addEventListener('error', function (ev) {
  var t = ev.target && ev.target !== window && (ev.target.src || ev.target.href);
  window.__hErr.push(t ? 'could not load ' + t : (ev.message || 'error') + (ev.filename ? ' @' + ev.filename.split('/').pop() + ':' + ev.lineno : ''));
}, true);
addEventListener('unhandledrejection', function (ev) { window.__hErr.push('promise: ' + ((ev.reason && ev.reason.message) || ev.reason)); });
setTimeout(function () {
  if (window.__heliosReady) return;
  var e = document.getElementById('loading');
  if (!e) { e = document.createElement('div'); e.id = 'loading'; document.body.appendChild(e); }
  e.className = 'err'; e.style.maxWidth = '90vw'; e.style.whiteSpace = 'normal';
  e.textContent = '3D did not start: ' + (window.__hErr.join(' | ') || 'no error caught, last step: ' + (window.__hStep || 'script never ran'));
}, 20000);
</script>

/* ------------------------------------------------------------------ 3D */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// background: a vertical colour gradient, redrawn as the hue drifts with scroll
const bgCanvas = document.createElement('canvas'); bgCanvas.width = 4; bgCanvas.height = 256;
const bgCtx = bgCanvas.getContext('2d');
const bgTex = new THREE.CanvasTexture(bgCanvas); bgTex.colorSpace = THREE.SRGBColorSpace;
scene.background = bgTex;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(28, 1, 2, 8000);
const key = new THREE.DirectionalLight('#fff0dc', 2.1);
key.position.set(-260, 520, 320);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -260, right: 260, top: 320, bottom: -120, near: 10, far: 1600 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.6;
scene.add(key);
// two coloured rims, opposite sides, that pick out edges in colour
const rimA = new THREE.DirectionalLight('#58d8e8', 1.6); rimA.position.set(420, 240, -380); scene.add(rimA);
const rimB = new THREE.DirectionalLight('#ff6f8e', 1.2); rimB.position.set(-460, 120, -300); scene.add(rimB);
const fill = new THREE.HemisphereLight('#f6e8ff', '#1a1420', 0.5); scene.add(fill);

const GROUND_Y = -27.3;
const ground = new THREE.Mesh(new THREE.CircleGeometry(2400, 64), new THREE.ShadowMaterial({ color: '#000000', opacity: 0.4 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = GROUND_Y; ground.receiveShadow = true; scene.add(ground);

// pool of light on the table, tinted by the LED colour when the lamp is on
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.42)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
})();
const pool = new THREE.Mesh(new THREE.PlaneGeometry(800, 800),
  new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
pool.rotation.x = -Math.PI / 2; pool.position.y = GROUND_Y + 0.2; scene.add(pool);
const tableLight = new THREE.PointLight('#ffcf94', 0, 900, 1.6); tableLight.position.set(0, -6, 0); scene.add(tableLight);
const innerLight = new THREE.PointLight('#ffd9a8', 0, 700, 1.4); innerLight.position.set(0, 130, 0); scene.add(innerLight);
const topLight = new THREE.PointLight('#ffd9a8', 0, 600, 1.6); topLight.position.set(0, 262, 0); scene.add(topLight);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0, 0.3, 0.96);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* materials, by the name each part was given in the CAD export */
const LOOK = {
  sand:         { color: '#e0cba6', roughness: 0.74, sheen: 0.5, sheenColor: '#fff0d6' },
  walnut:       { color: '#6a3f24', roughness: 0.58, clearcoat: 0.25, clearcoatRoughness: 0.5 },
  diffuser:     { color: '#f4f0ea', roughness: 0.55, glow: 0.32, led: true },
  terracotta:   { color: '#d4603a', roughness: 0.55 },
  flap_teal:    { color: '#2f9a9c', roughness: 0.5, sheen: 0.3, sheenColor: '#b9fff6' },
  gear_white:   { color: '#eeeae2', roughness: 0.45 },
  chassis_grey: { color: '#4f4d55', roughness: 0.66 },
  servo_blue:   { color: '#2f62e6', roughness: 0.32, clearcoat: 0.6 },
  steel:        { color: '#b0b3b8', roughness: 0.3, metalness: 0.9 },
  brass:        { color: '#d6a748', roughness: 0.32, metalness: 0.9 },
  led_strip:    { color: '#f6f4f0', roughness: 0.4, glow: 0.7, led: true },
};
const glowing = [];   // { mat, max, led }
function look(m) {
  const base = m.name.replace(/\.\d+$/, '');
  const spec = LOOK[base];
  if (!spec) return m.clone();                                   // PCB keeps its own colours
  const { glow, glowColor, led, ...rest } = spec;
  const mat = new THREE.MeshPhysicalMaterial({ ...rest, color: new THREE.Color(rest.color) });
  if (rest.sheenColor) mat.sheenColor = new THREE.Color(rest.sheenColor);
  if (glow) { mat.emissive = new THREE.Color(glowColor || '#ffd6a0'); mat.emissiveIntensity = 0; glowing.push({ mat, max: glow, led }); }
  return mat;
}

/* each gear gets its own colour so the chain reads: motor gear -> middle gear -> big ring -> flap gears */
const GEAR_COLOUR = { gear_servo: '#ff7a3d', gear_idler: '#ffd23f', gear_ring: '#ff4f9a' };
const PINION_COLOUR = '#3fd6c0';

/* RGB light rings: a ring of LED dots, each its own colour, the rainbow chasing round */
const rgbTime = { value: 0 };
const RGB_RINGS = { bottom_ring: 'bottom', thin_ring: 'top', tray_ring: 'top' };
const rgbAmt = { bottom: { value: 0 }, top: { value: 0 } };
const rgbMats = [];   // { mat, group }: the white ring darkens while lit so the LED colour reads
function rgbRing(mat, amt) {
  mat.emissive = new THREE.Color('#000000');
  mat.customProgramCacheKey = () => 'rgbring';
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uRgbT = rgbTime; sh.uniforms.uRgbAmt = amt;
    sh.vertexShader = 'varying vec3 vRgbP;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vRgbP = position;');
    sh.fragmentShader = 'uniform float uRgbT;\nuniform float uRgbAmt;\nvarying vec3 vRgbP;\n' +
      'vec3 rgbHue(float h) { return clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0); }\n' +
      sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float a = atan(vRgbP.z, vRgbP.x) / 6.28318 + 0.5; float N = 36.0;
        float seg = floor(a * N) / N; float f = fract(a * N);
        float pip = smoothstep(0.0, 0.22, f) * smoothstep(1.0, 0.78, f);
        totalEmissiveRadiance += rgbHue(fract(seg * 3.0 + uRgbT)) * uRgbAmt * mix(0.35, 1.0, pip); }`);
  };
  return mat;
}

/* entry moves: where each part flies in from */
const UP = (h) => new THREE.Vector3(0, h, 0);
// the board's layers float in a stack above it, then land one by one
const PCB_LIFT = { pcb_board: 0, pcb_wires: 20, pcb_parts: 42, pcb_headers: 64, pcb_terminals: 90, pcb_xiao: 120 };
function entry(name) {
  const e = { off: UP(260), delay: 0, twist: 0 };
  if (name in PCB_LIFT) e.off = UP(PCB_LIFT[name]), e.delay = 0.12 * (PCB.indexOf(name) - 1);
  if (name === 'chassis') e.off = UP(240);
  if (name.startsWith('encoder')) e.off = new THREE.Vector3(150, 10, 90), e.delay = name === 'encoder_wheel' ? 0.15 : 0;
  if (name === 'servo_cradle') e.off = UP(140);
  if (name === 'servo') e.off = UP(160), e.delay = 0.18;
  if (name === 'gear_ring') e.off = UP(200);
  if (name === 'gear_servo' || name === 'gear_idler') e.off = UP(150), e.delay = 0.12;
  if (name.startsWith('pinion_')) e.off = UP(140), e.delay = 0.18 + 0.035 * (+name.slice(7));
  if (name === 'base_skin' || name === 'touch_line') e.off = UP(-230), e.delay = name === 'touch_line' ? 0.25 : 0;
  if (name === 'bottom_strip') e.off = UP(-150);
  if (name === 'service_cap' || name === 'bottom_ring' || name === 'inserts') e.off = UP(-200), e.delay = 0.16;
  if (name === 'carrier') e.off = UP(220);
  if (name === 'screws_carrier') e.off = UP(-140), e.delay = 0.3;
  if (name === 'led_column') e.off = UP(380);
  if (name === 'posts') e.off = UP(380), e.delay = 0.15;
  if (name === 'cage_frame' || name === 'cage_panels') e.off = UP(400);
  if (name === 'lid') e.off = UP(220);
  if (name === 'dome_cap') e.off = UP(220);
  if (name === 'screws_top') e.off = UP(140), e.delay = 0.3;
  if (name === 'top_strip') e.off = UP(160);
  if (name === 'top_base_ring') e.off = UP(200), e.delay = 0.12;
  if (name === 'thin_ring') e.off = UP(200), e.delay = 0.24;
  if (name === 'tray' || name === 'tray_ring') e.off = UP(170), e.twist = 0.7;
  return e;
}

const parts = [];      // { node, step, home, homeQ, e, mats, pcb }
const flaps = [];
const gears = [];      // turned together so you can see one drive the next
let lamp = null;       // the whole model, turned in the finale
const loadingEl = document.getElementById('loading');

// the model ships as base64 text (artifact hosting serves text, not .glb), decoded here
async function fetchModel() {
  const res = await fetch('helios-glb.txt');
  if (!res.ok) throw new Error('model ' + res.status);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    chunks.push(value); got += value.length;
    if (total) loadingEl.textContent = `Loading the lamp \u00b7 ${Math.round(got / total * 100)}%`;
  }
  const text = new TextDecoder().decode(await new Blob(chunks).arrayBuffer()).replace(/\s+/g, '');
  const bin = atob(text); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
window.__hStep = 'fetching model';
fetchModel().then(buf => { window.__hStep = 'parsing model'; new GLTFLoader().parse(buf, '', onModel, onFail); }).catch(onFail);
function onFail(err) {
  loadingEl.textContent = 'The 3D model did not load: ' + ((err && err.message) || err); loadingEl.classList.add('err'); console.error(err);
}
function onModel(gltf) {
  const root = gltf.scene;
  const byName = {};
  root.children.forEach(n => { byName[n.name] = n; });
  STEPS.forEach((s, i) => s.parts.forEach(name => {
    const node = byName[name];
    if (!node) { console.warn('missing part', name); return; }
    const mats = [];
    node.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      o.material = Array.isArray(o.material) ? o.material.map(look) : look(o.material);
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        if (GEAR_COLOUR[name]) m.color.set(GEAR_COLOUR[name]);
        if (name.startsWith('pinion_')) m.color.set(PINION_COLOUR);
        if (RGB_RINGS[name]) {
          const gi = glowing.findIndex(g => g.mat === m); if (gi >= 0) glowing.splice(gi, 1);
          rgbRing(m, rgbAmt[RGB_RINGS[name]]); rgbMats.push({ mat: m, group: RGB_RINGS[name] });
        }
      });
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => mats.push(m));
    });
    const p = { node, step: i, home: node.position.clone(), homeQ: node.quaternion.clone(), e: entry(name), mats, pcb: name in PCB_LIFT };
    parts.push(p);
    if (name.startsWith('flap_')) flaps.push(p);
    if (name in GEAR_COLOUR || name.startsWith('pinion_')) gears.push(p);
  }));
  lamp = root; window.__heliosReady = true;
  scene.add(root);
  loadingEl.remove();
  layout(); onScroll();
}

/* ------------------------------------------------------------------ motion */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const iLight = STEPS.findIndex(s => s.light), iOpen = STEPS.findIndex(s => s.open), iEnd = STEPS.findIndex(s => s.end);
const SHOW0 = iOpen - 0.8, SHOW1 = iEnd - 0.15;      // the flapping + full turn runs across this scroll range
const FLAPS_CYCLES = 3.5;                             // open-close cycles; .5 so it ends open
const FLAP_OPEN = THREE.MathUtils.degToRad(-68);
const iGear = STEPS.findIndex(s => s.parts.includes('gear_ring'));
// axles of the two gears that are placed off-centre (mm, y up)
const GEAR_CENTRE = { gear_servo: new THREE.Vector3(41.02, 0, -16.99), gear_idler: new THREE.Vector3(62.08, 0, -25.72) };
const RING_WHITE = new THREE.Color('#f4f0ea'), RING_DARK = new THREE.Color('#1c1b20');
const qTmp = new THREE.Quaternion(), yAxis = new THREE.Vector3(0, 1, 0);

// WS2812B strips are RGB: in the finale the light sweeps through these
const LED_COLOURS = ['#ffb35a', '#ff6a5c', '#ff4fa3', '#a66bff', '#4fb8ff', '#3fe0c8', '#ffb35a'].map(c => new THREE.Color(c));
const ledColour = new THREE.Color(), tmpC = new THREE.Color(), WHITE = new THREE.Color('#ffffff');
function ledAt(c) {
  const n = LED_COLOURS.length - 1, x = ((c % 1) + 1) % 1 * n, i = Math.floor(x);
  return ledColour.copy(LED_COLOURS[i]).lerp(LED_COLOURS[i + 1], x - i);
}

let P = 0, Pshown = 0;
let W = 1, H = 1, phone = false;
function onScroll() {
  const vh = window.innerHeight;
  P = clamp(window.scrollY / vh, 0, STEPS.length - 1);
  const max = document.documentElement.scrollHeight - vh;
  document.querySelector('#progress i').style.width = `${max > 0 ? window.scrollY / max * 100 : 0}%`;
}
addEventListener('scroll', onScroll, { passive: true });

function layout() {
  W = innerWidth; H = innerHeight; phone = W <= 760;
  renderer.setSize(W, H, false);
  composer.setSize(W, H);
  // keep the lamp clear of the words: to the right on wide screens, above them on phones
  if (phone) { camera.aspect = W / (H * 1.35); camera.setViewOffset(W, H * 1.35, 0, H * 0.3, W, H); }
  else { camera.aspect = (W * 1.4) / H; camera.setViewOffset(W * 1.4, H, 0, 0, W, H); }
  camera.updateProjectionMatrix();
}
addEventListener('resize', layout);

function camAt(p) {
  const i = Math.floor(p), f = ease(p - i);
  const a = STEPS[Math.min(i, STEPS.length - 1)].cam, b = STEPS[Math.min(i + 1, STEPS.length - 1)].cam;
  const lerp = (x, y) => x + (y - x) * f;
  return { t: new THREE.Vector3(lerp(a.t[0], b.t[0]), lerp(a.t[1], b.t[1]), lerp(a.t[2], b.t[2])), d: lerp(a.d, b.d), el: lerp(a.el, b.el) };
}

// background + accent colour: the hue drifts as you scroll, darker once the lamp is lit
let lastBg = '';
function paintColours(p, L) {
  const h = (200 + p * 24) % 360;
  const top = `hsl(${h.toFixed(1)} 58% ${(30 - 14 * L).toFixed(1)}%)`;
  const mid = `hsl(${((h + 40) % 360).toFixed(1)} 50% ${(16 - 7 * L).toFixed(1)}%)`;
  const bot = `hsl(${((h + 80) % 360).toFixed(1)} 40% ${(8 - 3 * L).toFixed(1)}%)`;
  const keyStr = top + mid + bot;
  if (keyStr === lastBg) return;
  lastBg = keyStr;
  const g = bgCtx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, top); g.addColorStop(0.55, mid); g.addColorStop(1, bot);
  bgCtx.fillStyle = g; bgCtx.fillRect(0, 0, 4, 256); bgTex.needsUpdate = true;
  document.documentElement.style.setProperty('--accent', `hsl(${h.toFixed(0)} 80% 72%)`);
  rimA.color.setHSL(((h + 180) % 360) / 360, 0.75, 0.6);
  rimB.color.setHSL(((h + 300) % 360) / 360, 0.8, 0.62);
}

const clock = new THREE.Clock();
let spinIdle = 0, flapPhase = 0, ledIdle = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  Pshown += (P - Pshown) * (reduce ? 1 : 0.12);
  render(clock.elapsedTime, dt);
}
// for checking a single step: helios.go(6) jumps there and draws at once
window.helios = { go(n) { window.scrollTo(0, n * innerHeight); P = n; Pshown = n; onScroll(); render(clock.elapsedTime, 0); } };
function render(time, dt) {
  const p = Pshown;
  const L = iLight >= 0 ? smooth(iLight - 0.75, iLight - 0.05, p) : 0;
  paintColours(p, L);

  // camera
  const c = camAt(p);
  const fit = phone ? Math.max(1, 0.95 * (H * 1.35) / W) : Math.max(1, 1.15 * H / (W * 0.62) * 0.62);
  const az = THREE.MathUtils.degToRad(-38 + p * 11 + (reduce ? 0 : Math.sin(time * 0.15) * 2.5));
  const el = THREE.MathUtils.degToRad(c.el);
  const d = c.d * fit;
  camera.position.set(c.t.x + d * Math.cos(el) * Math.sin(az), c.t.y + d * Math.sin(el), c.t.z + d * Math.cos(el) * Math.cos(az));
  camera.lookAt(c.t);

  // parts fly in
  for (const q of parts) {
    let t;
    if (q.pcb) t = q.e.off.y === 0 ? 1 : ease(clamp((p - 0.1 - q.e.delay) / 0.4));   // board layers land between the first two stops
    else t = ease(clamp((p - (q.step - 0.85) - q.e.delay) / 0.7));
    q.node.visible = q.pcb || t > 0.001;
    const fade = q.pcb ? 1 : clamp(t * 2.6);
    for (const m of q.mats) { m.transparent = fade < 1; m.opacity = fade; m.depthWrite = fade > 0.5; }
    q.node.position.copy(q.home).addScaledVector(q.e.off, 1 - t);
    if (q.pcb && !reduce) q.node.position.y += Math.sin(time * 1.1 + q.e.off.y * 0.05) * 2.2 * (1 - t);   // gentle float while apart
    q.node.quaternion.copy(q.homeQ);
    if (q.e.twist) q.node.quaternion.premultiply(qTmp.setFromAxisAngle(yAxis, q.e.twist * (1 - smooth(0, 1, t))));
  }

  // finale: the flaps open and close several times while the whole lamp makes one full turn
  const u = clamp((p - SHOW0) / (SHOW1 - SHOW0));
  const idle = reduce ? 0 : smooth(iEnd - 0.4, iEnd, p);              // on the last stop it keeps going on its own
  spinIdle += dt * 0.35 * idle; flapPhase += dt * 1.3 * idle; ledIdle += dt * 0.06 * idle;
  if (idle < 0.01) { spinIdle *= 0.9; flapPhase = 0; }
  const scrollFlap = 0.5 - 0.5 * Math.cos(2 * Math.PI * FLAPS_CYCLES * u);
  const open = scrollFlap * (1 - idle) + idle * (0.5 + 0.5 * Math.cos(flapPhase));
  if (lamp) lamp.rotation.y = 2 * Math.PI * ease(u) + spinIdle;
  for (const q of flaps) {
    const raw = clamp((p - (q.step - 0.85) - 0.04 * (+q.node.name.slice(5))) / 0.7);
    const t = ease(raw);
    const out = q.home.clone().setY(0).normalize();
    q.node.position.copy(q.home).addScaledVector(out, 220 * (1 - t)).add(UP(120 * (1 - t)));
    q.node.quaternion.copy(q.homeQ).multiply(qTmp.setFromAxisAngle(yAxis, FLAP_OPEN * open));
  }

  // the gear train turns: flap gears follow the flaps, and on the gear step it rocks back and forth on its own
  const gearDemo = reduce ? 0 : (1 - smooth(0.25, 0.6, Math.abs(p - iGear))) * Math.sin(time * 1.3) * 1.1;
  const pin = FLAP_OPEN * open + gearDemo;                 // flap-gear angle
  const GEAR_TURN = { gear_ring: pin * 20 / 130, gear_idler: pin * 20 / 18, gear_servo: -pin };
  for (const q of gears) {
    const n = q.node.name;
    if (n.startsWith('pinion_')) { q.node.quaternion.multiply(qTmp.setFromAxisAngle(yAxis, pin)); continue; }
    const a = GEAR_TURN[n];
    qTmp.setFromAxisAngle(yAxis, a);
    q.node.quaternion.premultiply(qTmp);
    const c = GEAR_CENTRE[n];
    if (c) q.node.position.add(c.clone().sub(c.clone().applyQuaternion(qTmp)));   // turn about its own axle
  }

  // RGB rings: light up on their own build step, then for good once the lamp is on
  rgbTime.value = reduce ? p * 0.05 : time * 0.12 + p * 0.05;
  const iBottom = STEPS.findIndex(s => s.parts.includes('bottom_ring')), iHalo = STEPS.findIndex(s => s.parts.includes('thin_ring'));
  const own = (a, b) => smooth(a - 0.25, a + 0.05, p) * (1 - smooth(b + 0.4, b + 0.75, p));
  const onB = Math.max(L, own(iBottom, iBottom)), onT = Math.max(L, own(iHalo, iHalo + 1));
  rgbAmt.bottom.value = 2.0 * onB; rgbAmt.top.value = 2.0 * onT;
  for (const r of rgbMats) r.mat.color.lerpColors(RING_WHITE, RING_DARK, (r.group === 'bottom' ? onB : onT) * 0.9);

  // lights on: warm first, then the colour sweeps round as the lamp turns
  const led = ledAt(u * 1.0 + ledIdle);
  for (const g of glowing) {
    g.mat.emissiveIntensity = g.max * L;
    if (g.led) g.mat.emissive.copy(tmpC.copy(led).lerp(WHITE, 0.08));
  }
  const openNow = Math.max(open, u > 0 ? 0.35 : 0);
  scene.environmentIntensity = 0.55 * (1 - 0.3 * L);
  key.intensity = 2.1 * (1 - 0.4 * L);
  rimA.intensity = 1.6 * (1 - 0.4 * L);
  rimB.intensity = 1.2 * (1 - 0.4 * L);
  fill.intensity = 0.5 * (1 - 0.3 * L);
  pool.material.opacity = 0.2 * L; pool.material.color.copy(led);
  tableLight.color.copy(led); innerLight.color.copy(led); topLight.color.copy(led);
  tableLight.intensity = 1300 * L;
  innerLight.intensity = 6500 * L * (0.2 + 0.8 * openNow);
  topLight.intensity = 700 * L;
  bloom.strength = 0.12 * L;

  composer.render();
}
layout(); onScroll(); frame();
</script>
